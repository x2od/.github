# Tests the reusable Dependabot workflow.
#
# 1. actionlint checks all workflows in this repository (with shellcheck).
# 2. tests/dependabot-reusable/run_tests.py runs each step script of
#    dependabot-reusable.yml with a fake gh command, and checks the results.
#
# Callers use dependabot-reusable.yml at @main, so a bad change breaks them at once.
# Run these tests on each pull request before the merge.

name: Test Dependabot workflow

on:
  pull_request:
    paths:
      - .github/workflows/dependabot-reusable.yml
      - .github/workflows/test-dependabot-reusable.yml
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/dependabot-reusable.yml
      - .github/workflows/test-dependabot-reusable.yml
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: actionlint and step tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Install PyYAML
        # The runner image often has PyYAML. The system Python blocks a plain pip install (PEP 668).
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user --break-system-packages PyYAML

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          jq --version
          python3 --version

      - name: Run the step tests
        run: python3 tests/dependabot-reusable/run_tests.py
