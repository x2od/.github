# Calls the reusable Dependabot workflow in this repository.
# See .github/workflows/dependabot-reusable.yml for all inputs and token permissions.

name: Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions: {}

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/dependabot-reusable.yml
    with:
      autoapprove-minor: true
      autoapprove-patch: true
      automerge-minor: true
      automerge-patch: true
    secrets:
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}
