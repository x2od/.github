# Calls the reusable Dependabot workflow in this repository.
# See .github/workflows/dependabot-reusable.yml for all inputs and token permissions.
#
# Rules, for all 3 dependency types (production, development, and indirect):
#   - Approve and merge minor and patch updates. Major updates need a manual review.
#   - Approve and merge security updates at all levels, including major. This needs
#     the token secret with "Dependabot alerts: Read-only".
#
# 3 calls run for each PR, 1 for each dependency type. Each PR has exactly 1
# dependency type, so exactly 1 call approves and merges it. The 3 calls have the
# same inputs now. They are separate so that each dependency type can get
# different inputs later.

name: Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions: {}

jobs:
  production:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/dependabot-reusable.yml
    with:
      dependency-types: direct:production
      autoapprove-major: false
      autoapprove-minor: true
      autoapprove-patch: true
      autoapprove-security: true
      automerge-major: false
      automerge-minor: true
      automerge-patch: true
      automerge-security: true
    secrets:
      # Organization secret. Store it 2 times, with this same name: as a Dependabot
      # secret (runs that Dependabot starts can read only Dependabot secrets) and as
      # an Actions secret (for the run after the merge).
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}

  development:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/dependabot-reusable.yml
    with:
      dependency-types: direct:development
      autoapprove-major: false
      autoapprove-minor: true
      autoapprove-patch: true
      autoapprove-security: true
      automerge-major: false
      automerge-minor: true
      automerge-patch: true
      automerge-security: true
    secrets:
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}

  indirect:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/dependabot-reusable.yml
    with:
      dependency-types: indirect
      autoapprove-major: false
      autoapprove-minor: true
      autoapprove-patch: true
      autoapprove-security: true
      automerge-major: false
      automerge-minor: true
      automerge-patch: true
      automerge-security: true
    secrets:
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}
