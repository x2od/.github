# Calls the x2od reusable Dependabot workflow. It edits the PR title, adds labels,
# and approves and merges Dependabot PRs. All inputs and the token permissions are
# explained at the top of:
# https://github.com/x2od/.github/blob/main/.github/workflows/dependabot-reusable.yml
#
# Before you use this workflow, turn on these repository settings:
#   - Settings > General > "Allow auto-merge"
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" (only if you do not pass the token secret)

name: Dependabot

on:
  # pull_request_target gives Dependabot PRs a writable GITHUB_TOKEN and Actions
  # secrets. The reusable workflow never checks out code from the PR.
  # Keep all 5 types. "closed" adds the labels after the merge.
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions: {}

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # merge the PR
      pull-requests: write # edit the title, approve, turn on auto-merge
      issues: write # create labels and add them to the PR
    uses: x2od/.github/.github/workflows/dependabot-reusable.yml@main
    with:
      # All inputs are optional. All booleans default to false, except
      # rename-title and create-labels (default true).
      autoapprove-major: false
      autoapprove-minor: true
      autoapprove-patch: true
      automerge-major: false
      automerge-minor: true
      automerge-patch: true
      # autoapprove-security: true # needs the token secret
      # automerge-security: true # needs the token secret
      # dependency-types: direct:production,direct:development,indirect
      # merge-method: squash
      # merge-mode: auto # auto (GitHub auto-merge, or wait if it is off), wait, or now
      # wait-timeout-minutes: 30
    secrets:
      # Optional. Without it, the workflow uses the GITHUB_TOKEN. Then the merge does
      # not start other workflows, and the labels after an auto-merge are not added.
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}
