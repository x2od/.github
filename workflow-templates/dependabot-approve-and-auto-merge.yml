# Calls the x2od reusable Dependabot workflow. It edits the PR title, adds labels,
# and approves and merges Dependabot PRs. All inputs and the token permissions are
# explained at the top of:
# https://github.com/x2od/.github/blob/main/.github/workflows/dependabot-reusable.yml
#
# This file passes every input of the reusable workflow, each set to its default
# value. With these defaults, the workflow edits the PR title and adds the labels,
# but it does not approve or merge any PR. To approve and merge, change the inputs
# below. For example, the x2od and dschach callers set the 6 per-type inputs to
# "minor,patch,security".
#
# How the approve and merge inputs work together:
#   - The 6 per-type inputs (autoapprove-<type> and automerge-<type>) take a
#     comma-separated list of major, minor, patch, and security (or "none"). If set,
#     a per-type input replaces the 4 boolean inputs of the same kind for that
#     dependency type.
#   - The 8 boolean inputs apply to each dependency type that has no per-type input.
#   - The security inputs need the token secret with "Dependabot alerts: Read-only".
#
# Before you use this workflow, check these repository settings:
#   - Settings > General > "Allow auto-merge". If it is off (or not available, for
#     example in a private repository on a free plan), the workflow waits for the
#     other checks to pass, and then merges (merge-mode: auto).
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" (only if you do not pass the token secret)

name: Dependabot on Pull Request

on:
  # pull_request_target gives Dependabot PRs a writable GITHUB_TOKEN. The reusable
  # workflow never checks out code from the PR.
  #
  # From 2026-11-02, GitHub blocks pull_request_target in public repositories unless an
  # Actions event policy allows it. Save this file as .github/workflows/dependabot-update.yml.
  # In an x2od repository, the organization policy "Allow pull_request_target for the
  # Dependabot workflow" allows the event for that file. In another organization or a
  # personal account, add a repository policy (Settings > Actions > Policies) that
  # allows pull_request_target for that file.
  # Keep all 5 types. "closed" adds the labels after the merge.
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]

permissions: {}

jobs:
  dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write # merge the PR
      pull-requests: write # edit the title, approve, turn on auto-merge
      issues: write # create labels and add them to the PR
    uses: x2od/.github/.github/workflows/dependabot-reusable.yml@main
    with:
      # Boolean approve and merge inputs, for each dependency type without a
      # per-type input.
      autoapprove-major: false
      autoapprove-minor: false
      autoapprove-patch: false
      automerge-major: false
      automerge-minor: false
      automerge-patch: false
      autoapprove-security: false # needs "Dependabot alerts: Read-only"
      automerge-security: false # needs "Dependabot alerts: Read-only"
      # The dependency types that this call can approve and merge.
      dependency-types: direct:production,direct:development,indirect
      # Per-type lists: major, minor, patch, and security (or "none"). Empty means
      # "use the boolean inputs above".
      autoapprove-production: minor,patch,security
      automerge-production: minor,patch,security
      autoapprove-development: minor,patch,security
      automerge-development: minor,patch,security
      autoapprove-indirect: ''
      automerge-indirect: ''
      # Edit the title and add the labels. With more than 1 call, set false on all
      # calls but 1.
      rename-title: true
      # Title type for an indirect npm package that only development dependencies
      # need. An empty string keeps "deps".
      indirect-development-type: build
      # Create the "dependabot" and "auto-merged" labels if they do not exist.
      create-labels: true
      merge-method: squash # squash, merge, or rebase
      merge-mode: auto # auto (GitHub auto-merge, or wait if it is off), wait, or now
      wait-timeout-minutes: 30 # 1 to 50; for a wait in the job
      # The login of the token user. Empty finds it automatically.
      token-user: ''
    secrets:
      # Optional PAT. Store it 2 times, with this same name: as a Dependabot secret
      # (runs that Dependabot starts can read only Dependabot secrets) and as an
      # Actions secret (for the run after the merge). The x2od organization uses the
      # name DEPENDABOT_TOKEN_X2OD. Without it, the workflow uses the GITHUB_TOKEN.
      # Then the merge does not start other workflows, the labels after an
      # auto-merge are not added, and security updates are not found.
      token: ${{ secrets.DEPENDABOT_TOKEN_X2OD }}
